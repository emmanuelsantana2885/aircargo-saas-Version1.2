# ─── Aircargo SaaS — Production orchestrator (used by deploy-ec2.sh / setup-https.sh) ───
# This file is the single entrypoint for `docker compose up` on the server.
# It includes the microservices + infrastructure definitions from docker/ and
# adds the frontend (nginx) + certbot (Let's Encrypt auto-renewal).

include:
  - docker/docker-compose.infrastructure.yml
  - docker/docker-compose.services.yml

services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aircargo-web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - aircargo-gateway

  # Auto-renew Let's Encrypt certificates every 12 hours
  certbot:
    image: certbot/certbot:latest
    container_name: aircargo-certbot
    restart: unless-stopped
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /usr/share/nginx/html; sleep 12h & wait $${!}; done;'"
