  { id: 'darcula', name: 'Material Dark (Darcula)', cls: 'theme-darcula', accent: '#bb86fc', colors: ['#bb86fc','#8f9bb3','#2b2b3d'] },

// 11 icon styles: first 7 fill-based, last 4 are stroke/alias variants
const STYLE_NAMES = ['outline', 'filled', 'duotone', 'bold', 'sharp', 'round', 'minimal', 'thick', 'thin', 'curved', 'angular']
const STYLE_DESC = ['Lineal', 'Relleno', 'Dos tonos', 'Negrita', 'Filo', 'Redondo', 'Mínimo', 'Grueso ⬤', 'Fino ⬤', 'Curvo', 'Angular']

// thick/thin use stroke rendering with outline paths
// curved = round, angular = sharp
function svg(pathD, color, w, h) {
  w = w || 20; h = h || 20
  return `<svg width="${w}" height="${h}" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="${pathD}" fill="${color}" opacity=".9"/></svg>`
}

function strokeSvg(pathD, color, strokeWidth, w, h) {
  w = w || 20; h = h || 20
  return `<svg width="${w}" height="${h}" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="${pathD}" stroke="${color}" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/></svg>`
}

function duotoneSvg(d1, d2, color, w, h) {
  w = w || 20; h = h || 20
  return `<svg width="${w}" height="${h}" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="${d1}" fill="${color}" opacity=".4"/>
    <path d="${d2}" fill="${color}" opacity=".95"/>
  </svg>`
}

function iconHTML(paths, color, style) {
  if (style === 'thick') {
    // stroke-based: heavy stroke using outline path
    const p = paths.outline
    return p ? strokeSvg(p, color, 2.8) : ''
  }
  if (style === 'thin') {
    // stroke-based: fine stroke using outline path
    const p = paths.outline
    return p ? strokeSvg(p, color, 1) : ''
  }
  if (style === 'curved') {
    // alias for round
    const p = paths.round
    return p ? svg(p, color) : ''
  }
  if (style === 'angular') {
    // alias for sharp
    const p = paths.sharp
    return p ? svg(p, color) : ''
  }
  if (style === 'duotone' && paths.duotone1 && paths.duotone2) {
    return duotoneSvg(paths.duotone1, paths.duotone2, color)
  }
  const p = paths[style] || paths.outline
  return p ? svg(p, color) : ''
}

// Build grid
const grid = document.getElementById('grid')
const viewKeys = Object.keys(ICONS)

for (const theme of THEMES) {
  const card = document.createElement('div')
  card.className = `theme-card ${theme.cls}`
  card.dataset.theme = theme.id

  let html = `<div class="theme-header">
    <div class="theme-name">◈ ${theme.name}</div>
    <div class="theme-colors">${theme.colors.map(c => `<span style="background:${c}"></span>`).join('')}</div>
  </div>`

  // Style header row (column labels)
  html += `<div class="style-header">${STYLE_NAMES.map((s, i) =>
    `<span class="sh-label" title="${STYLE_DESC[i]}">${s}</span>`
  ).join('')}</div>`

  for (const key of viewKeys) {
    const iconDef = ICONS[key]
    html += `<div class="icon-row">
      <span class="label"><strong>${iconDef.label}</strong></span>
      <div class="icon-variants">`
    for (const style of STYLE_NAMES) {
      html += iconHTML(iconDef.paths, theme.accent, style)
    }
    html += `</div></div>`
  }

  card.innerHTML = html
  grid.appendChild(card)
}

// Filter toggles
document.querySelectorAll('.theme-filter').forEach(cb => {
  cb.addEventListener('change', () => {
    document.querySelectorAll('.theme-card').forEach(card => {
      const match = card.dataset.theme === cb.value
      card.classList.toggle('hidden', !cb.checked)
    })
  })
})
