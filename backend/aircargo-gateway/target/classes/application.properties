spring.application.name=aircargo-gateway
server.port=8080

# ─── CORS ────────────────────────────────────────
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173,http://localhost:5174
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# ─── Circuit Breaker Defaults ─────────────────────
resilience4j.circuitbreaker.instances.default.sliding-window-size=10
resilience4j.circuitbreaker.instances.default.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.default.record-exceptions=java.io.IOException,java.util.TimeoutException
resilience4j.circuitbreaker.instances.default.ignore-exceptions=com.aircargo.gateway.exception.GatewayAuthenticationException

resilience4j.circuitbreaker.instances.auth-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.auth-service.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.auth-service.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.auth-service.permitted-number-of-calls-in-half-open-state=2

resilience4j.circuitbreaker.instances.flight-service.sliding-window-size=8
resilience4j.circuitbreaker.instances.flight-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.flight-service.wait-duration-in-open-state=20s

resilience4j.circuitbreaker.instances.warehouse-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.warehouse-service.failure-rate-threshold=40
resilience4j.circuitbreaker.instances.warehouse-service.wait-duration-in-open-state=25s

resilience4j.circuitbreaker.instances.booking-service.sliding-window-size=8
resilience4j.circuitbreaker.instances.booking-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.booking-service.wait-duration-in-open-state=20s

resilience4j.circuitbreaker.instances.mawb-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.mawb-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.mawb-service.wait-duration-in-open-state=20s

resilience4j.circuitbreaker.instances.uld-service.sliding-window-size=8
resilience4j.circuitbreaker.instances.uld-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.uld-service.wait-duration-in-open-state=20s

resilience4j.circuitbreaker.instances.load-planning-service.sliding-window-size=8
resilience4j.circuitbreaker.instances.load-planning-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.load-planning-service.wait-duration-in-open-state=20s

resilience4j.circuitbreaker.instances.export-service.sliding-window-size=8
resilience4j.circuitbreaker.instances.export-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.export-service.wait-duration-in-open-state=20s

resilience4j.circuitbreaker.instances.compliance-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.compliance-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.compliance-service.wait-duration-in-open-state=20s

# ─── Circuit Breaker Actuator ────────────────────
resilience4j.circuitbreaker.configs.default.shared-sliding-window-size=10
resilience4j.circuitbreaker.configs.default.shared-wait-duration-in-open-state=30s

# ─── JWT ─────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production-please-change-me}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ─── Rate Limiting ───────────────────────────────
resilience4j.ratelimiter.configs.default.limit-for-period=100
resilience4j.ratelimiter.configs.default.limit-refresh-period=1m
resilience4j.ratelimiter.configs.default.timeout-duration=0

# ─── Actuator ────────────────────────────────────
management.endpoints.web.exposure.include=health,info,gateway,circuitbreakers,circuitbreakerevents,ratelimiters
management.endpoint.health.show-details=when_authorized
management.health.circuitbreakers.enabled=true

# ─── Logging ─────────────────────────────────────
logging.level.com.aircargo.gateway=INFO
logging.level.org.springframework.cloud.gateway=INFO
logging.level.io.github.resilience4j=INFO
